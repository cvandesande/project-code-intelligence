name: project-code-intelligence

services:
  pgvector:
    profiles: ["db"]
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PCI_PG_DB:-codeintel}
      POSTGRES_USER: ${PCI_PG_USER:-codeintel}
      POSTGRES_PASSWORD: ${PCI_PG_PASS:-codeintel}
    ports:
      - "${PCI_BIND_HOST:-127.0.0.1}:${PCI_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PCI_PG_USER:-codeintel} -d ${PCI_PG_DB:-codeintel}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgvector-data:/var/lib/postgresql
      - ./docker/pgvector/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro

volumes:
  pgvector-data:
