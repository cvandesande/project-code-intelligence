[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project-code-intelligence"
version = "0.1.0"
description = "MCP server and ingestion toolkit for a Postgres/pgvector code-intelligence database."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "project-code-intelligence contributors" },
]
keywords = [
  "code-intelligence",
  "mcp",
  "pgvector",
  "postgresql",
  "static-analysis",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Indexing",
]
dependencies = [
  "psycopg[binary]>=3.1",
  "pydantic>=2.5",
  "rich>=13.0",
  "mlx-lm>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
pci-index = "project_code_intelligence.cli:index_main"
pci-ingest-code = "project_code_intelligence.ingest_code_intel:cli_main"
pci-llama-embed = "project_code_intelligence.embedding.llama:main"
pci-apple-llama-server = "project_code_intelligence.embedding.apple_llama_server:main"
pci-apple-embed-server = "project_code_intelligence.embedding.apple_embed_server:main"
pci-fastembed-server = "project_code_intelligence.embedding.fastembed_server:main"
pci-embedding-bench = "project_code_intelligence.embedding.bench:main"
pci-doctor = "project_code_intelligence.doctor:main"
pci-mcp = "project_code_intelligence.server:main"
pci-mcp-smoke = "project_code_intelligence.cli:mcp_smoke_main"

[project.optional-dependencies]
local-embeddings = [
  "fastembed>=0.8.0",
]

[dependency-groups]
dev = [
  "bandit>=1.7.10",
  "basedpyright>=1.39",
  "coverage[toml]>=7.14.0",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "ruff>=0.15.12",
  "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/cvandesande/project-code-intelligence"
Repository = "https://github.com/cvandesande/project-code-intelligence"
Issues = "https://github.com/cvandesande/project-code-intelligence/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["project_code_intelligence*"]

[tool.setuptools.package-data]
project_code_intelligence = ["schema.sql", "docker-compose.yml"]

[tool.bandit]
exclude_dirs = ["build", "dist", ".venv", "src/project_code_intelligence.egg-info"]
# B404: subprocess import is intentional; concentrated in process.py wrapper that hardcodes shell=False.
# B603: subprocess call is safe; same wrapper enforces shell=False and argument-vector calls only.
# B310: urllib.request usage is intentional; http_client.py validates scheme/netloc before any call.
skips = ["B404", "B603", "B310"]

[tool.ruff]
line-length = 120
target-version = "py310"
preview = true
extend-exclude = [
  "build",
  "dist",
  "src/project_code_intelligence.egg-info",
]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "BLE",
  "C4",
  "C90",
  "E",
  "EM",
  "EXE",
  "F",
  "FBT",
  "FURB",
  "I",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "TC",
  "TRY",
  "UP",
]
ignore = [
  # Exception-message style is mostly churn for a CLI-oriented tool. The
  # current code raises direct ValueError/RuntimeError messages at argument,
  # parser, and boundary checks where a custom exception class per message
  # would add noise without improving recovery.
  "EM101",
  "EM102",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Profile methods are extension hooks. They intentionally keep instance method
# shape even when default/example implementations do not need instance state.
"src/project_code_intelligence/code_profiles/*.py" = ["PLR6301"]
"src/project_code_intelligence/http_client.py" = ["S310"]
"src/project_code_intelligence/embedding/fastembed_server.py" = ["A002"]
"src/project_code_intelligence/process.py" = ["S404", "S603"]
# SARIF patterns may be absolute or relative and can use **; glob.glob handles
# that mixed user-input shape more directly than Path.glob/Path.rglob.
"src/project_code_intelligence/sarif/discovery.py" = ["PTH207"]
# Test doubles mimic third-party interfaces and may not need instance state.
"tests/test_ingest_code_intel.py" = ["PLR6301"]
"typings/**/*.pyi" = ["ANN401"]
