[tool.uv]
python-preference = "only-system"
# semgrep (dev-only) hard-pins mcp==1.23.3, which carries PYSEC-2026-3481/3482/3483.
# We use only `semgrep scan`, never its `mcp` subcommand, so forcing the fixed
# SDK version is safe and clears the deps-audit gate.
override-dependencies = ["mcp>=1.28.1,<2"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "project-code-intelligence"
version = "0.1.0"
description = "MCP server and ingestion toolkit for a Postgres/pgvector code-intelligence database."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "project-code-intelligence contributors" },
]
keywords = [
  "code-intelligence",
  "mcp",
  "pgvector",
  "postgresql",
  "static-analysis",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Indexing",
]
dependencies = [
  "psycopg[binary]>=3.1",
  "pydantic>=2.5",
  "rich>=13.0",
  "mlx-lm>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
pci-index = "project_code_intelligence.cli:index_main"
pci-analyze = "project_code_intelligence.analyze:main"
pci-evidence = "project_code_intelligence.evidence:main"
pci-hook = "project_code_intelligence.hooks.cli:main"
pci-context = "project_code_intelligence.context:main"
pci-ingest-code = "project_code_intelligence.ingest_code_intel:cli_main"
pci-llama-embed = "project_code_intelligence.embedding.llama:main"
pci-apple-embed-server = "project_code_intelligence.embedding.apple_embed_server:main"
pci-fastembed-server = "project_code_intelligence.embedding.fastembed_server:main"
pci-embedding-bench = "project_code_intelligence.embedding.bench:main"
pci-doctor = "project_code_intelligence.doctor:main"
pci-mcp = "project_code_intelligence.server:main"
pci-mcp-smoke = "project_code_intelligence.cli:mcp_smoke_main"

[project.optional-dependencies]
local-embeddings = [
  "fastembed>=0.8.0",
]

[dependency-groups]
dev = [
  "bandit>=1.7.10",
  "basedpyright>=1.39",
  "coverage[toml]>=7.14.0",
  "deptry>=0.25.1",
  "import-linter>=2.11",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "ruff>=0.15.12",
  "semgrep>=1.163.0",
  "tomli>=2.0.1",
  "typing-extensions>=4.12",
  "vulture>=2.16",
]

[project.urls]
Homepage = "https://github.com/cvandesande/project-code-intelligence"
Repository = "https://github.com/cvandesande/project-code-intelligence"
Issues = "https://github.com/cvandesande/project-code-intelligence/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["project_code_intelligence*"]

[tool.setuptools.package-data]
project_code_intelligence = [
  "schema.sql",
  "docker-compose.yml",
  "bin/pci-embedding-server",
  "docker/build-context/LICENSE",
  "docker/build-context/README.md",
  "docker/build-context/pyproject.toml",
  "docker/fastembed/Dockerfile",
  "docker/llamacpp-cuda/Dockerfile",
  "docker/llamacpp-cuda/entrypoint.sh",
  "docker/llamacpp-rocm/Dockerfile",
  "docker/llamacpp-rocm/entrypoint.sh",
  "docker/pgvector/init-extensions.sql",
  "scripts/select_llamacpp_rocm_bundle.py",
]

[tool.basedpyright]
include = ["src/project_code_intelligence", "scripts", "tests"]
pythonVersion = "3.10"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
executionEnvironments = [
  { root = ".", extraPaths = ["src"] },
]
reportAttributeAccessIssue = "error"
reportAny = "error"
reportExplicitAny = "error"
reportImplicitOverride = "error"
reportMissingModuleSource = "error"
reportMissingTypeStubs = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedImport = "error"
reportUnusedCallResult = "error"
reportUnusedParameter = "error"

[tool.bandit]
exclude_dirs = ["build", "dist", ".venv", "src/project_code_intelligence.egg-info"]
# B404: subprocess import is intentional; concentrated in process.py wrapper that hardcodes shell=False.
# B603: subprocess call is safe; same wrapper enforces shell=False and argument-vector calls only.
# B310: urllib.request usage is intentional; http_client.py validates scheme/netloc before any call.
skips = ["B404", "B603", "B310"]

[tool.deptry]
known_first_party = ["project_code_intelligence"]
no_ansi = true
package_module_name_map = { "mlx-lm" = "mlx_lm", fastembed = "fastembed" }

[tool.importlinter]
root_package = "project_code_intelligence"

[[tool.importlinter.contracts]]
name = "MCP server stays independent of indexing and doctor orchestration"
type = "forbidden"
source_modules = [
  "project_code_intelligence.mcp",
  "project_code_intelligence.server",
]
forbidden_modules = [
  "project_code_intelligence.cli",
  "project_code_intelligence.doctor",
  "project_code_intelligence.ingest_code_intel",
]

[[tool.importlinter.contracts]]
name = "Library packages stay independent of MCP and CLI entrypoints"
type = "forbidden"
source_modules = [
  "project_code_intelligence.code_profiles",
  "project_code_intelligence.embedding",
  "project_code_intelligence.language_profiles",
  "project_code_intelligence.parsers",
  "project_code_intelligence.sarif",
  "project_code_intelligence.storage",
]
forbidden_modules = [
  "project_code_intelligence.cli",
  "project_code_intelligence.mcp",
]

[tool.ruff]
line-length = 120
target-version = "py310"
preview = true
extend-exclude = [
  "build",
  "dist",
  "src/project_code_intelligence.egg-info",
]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "BLE",
  "C4",
  "C90",
  "E",
  "EM",
  "EXE",
  "F",
  "FBT",
  "FURB",
  "I",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "TC",
  "TRY",
  "UP",
]
ignore = [
  # Exception-message style is mostly churn for a CLI-oriented tool. The
  # current code raises direct ValueError/RuntimeError messages at argument,
  # parser, and boundary checks where a custom exception class per message
  # would add noise without improving recovery.
  "EM101",
  "EM102",
  "TRY003",
]

[tool.ruff.lint.flake8-type-checking]
# pydantic BaseModel subclasses use `get_type_hints` at class-creation time
# to build validators, so annotations referencing project Literal aliases
# (e.g. ConfidenceKind in mcp.taxonomies) must resolve at runtime — moving
# those imports under TYPE_CHECKING would break pydantic. Declaring our
# BaseModel base here tells ruff to leave those imports at module scope.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
# Profile methods are extension hooks. They intentionally keep instance method
# shape even when default/example implementations do not need instance state.
"src/project_code_intelligence/code_profiles/*.py" = ["PLR6301"]
"src/project_code_intelligence/http_client.py" = ["S310"]
"src/project_code_intelligence/embedding/fastembed_server.py" = ["A002"]
"src/project_code_intelligence/process.py" = ["S404", "S603"]
# SARIF patterns may be absolute or relative and can use **; glob.glob handles
# that mixed user-input shape more directly than Path.glob/Path.rglob.
"src/project_code_intelligence/sarif/discovery.py" = ["PTH207"]
# Test doubles mimic third-party interfaces and may not need instance state.
"tests/test_ingest_code_intel.py" = ["PLR6301"]
# Override of BaseHTTPRequestHandler.log_message must keep the name "format".
"tests/test_apple_embed_server.py" = ["A002"]
"typings/**/*.pyi" = ["ANN401"]

[tool.coverage.run]
branch = true
source = ["project_code_intelligence"]

[tool.coverage.report]
# Current unit-test baseline. Keep this passing and ratchet upward with focused
# tests rather than excluding low-coverage modules.
fail_under = 70
precision = 2
show_missing = true
skip_covered = false
