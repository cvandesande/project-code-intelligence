[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "project-code-intelligence"
version = "0.1.0"
description = "MCP server and ingestion toolkit for a Postgres/pgvector code-intelligence database."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
]

[project.scripts]
pci-fastembed-server = "project_code_intelligence.embedding.fastembed_server:main"

[project.optional-dependencies]
local-embeddings = [
  "fastembed>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["project_code_intelligence*"]

[tool.setuptools.package-data]
project_code_intelligence = ["schema.sql", "docker-compose.yml"]
