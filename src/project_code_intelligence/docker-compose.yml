name: project-code-intelligence

services:
  pgvector:
    profiles: ["db"]
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PCI_PG_DB:-codeintel}
      POSTGRES_USER: ${PCI_PG_USER:-codeintel}
      POSTGRES_PASSWORD: ${PCI_PG_PASS:-codeintel}
    ports:
      - "${PCI_BIND_HOST:-127.0.0.1}:${PCI_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PCI_PG_USER:-codeintel} -d ${PCI_PG_DB:-codeintel}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgvector-data:/var/lib/postgresql
      - ./docker/pgvector/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro

  fastembed:
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: docker/fastembed/Dockerfile
    environment:
      PCI_FASTEMBED_MODEL: ${PCI_FASTEMBED_MODEL:-jinaai/jina-embeddings-v2-base-code}
      PCI_FASTEMBED_CACHE_DIR: /models/fastembed
      PCI_FASTEMBED_HOST: 0.0.0.0
      PCI_FASTEMBED_PORT: 18081
    ports:
      - "${PCI_BIND_HOST:-127.0.0.1}:${PCI_EMBEDDING_PORT:-18081}:18081"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18081/healthz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - fastembed-models:/models/fastembed

  lemonade-npu:
    profiles: ["npu"]
    image: ${PCI_LEMONADE_IMAGE:-ghcr.io/lemonade-sdk/lemonade-server:latest}
    command: ["./lemond", "--host", "0.0.0.0", "--port", "13305"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      PCI_EMBEDDING_ENDPOINT_MODEL: ${PCI_LEMONADE_EMBEDDING_MODEL:-embed-gemma-300m-FLM}
    ports:
      - "${PCI_BIND_HOST:-127.0.0.1}:${PCI_EMBEDDING_PORT:-18081}:13305"
    devices:
      - /dev/accel/accel0:/dev/accel/accel0
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - lemonade-huggingface:/root/.cache/huggingface
      - lemonade-llama:/opt/lemonade/llama
      - lemonade-cache:/root/.cache/lemonade

  llama-rocm:
    profiles: ["amdgpu"]
    build:
      context: .
      dockerfile: docker/llamacpp-rocm/Dockerfile
      args:
        ROCM_BASE_IMAGE: ${PCI_ROCM_BASE_IMAGE:-debian:stable-slim}
    environment:
      PCI_AMD_GFX: ${PCI_AMD_GFX:-}
      PCI_LLAMA_CPP_ROCM_BUNDLE: ${PCI_LLAMA_CPP_ROCM_BUNDLE:-}
      PCI_LLAMA_CPP_ROCM_RELEASE: ${PCI_LLAMA_CPP_ROCM_RELEASE:-latest}
      PCI_LLAMA_CPP_ROCM_REPO: ${PCI_LLAMA_CPP_ROCM_REPO:-lemonade-sdk/llamacpp-rocm}
      PCI_HF_MODEL_REPO: ${PCI_HF_MODEL_REPO:-Qwen/Qwen3-Embedding-0.6B-GGUF}
      PCI_HF_MODEL_FILE: ${PCI_HF_MODEL_FILE:-Qwen3-Embedding-0.6B-Q8_0.gguf}
      PCI_LLAMA_MODEL: ${PCI_LLAMA_MODEL:-/models/Qwen3-Embedding-0.6B-Q8_0.gguf}
      PCI_EMBEDDING_HOST: 0.0.0.0
      PCI_EMBEDDING_PORT: 18081
      PCI_LLAMA_SERVER_CTX: ${PCI_LLAMA_SERVER_CTX:-40960}
      PCI_LLAMA_SERVER_BATCH: ${PCI_LLAMA_SERVER_BATCH:-2048}
      PCI_LLAMA_SERVER_UBATCH: ${PCI_LLAMA_SERVER_UBATCH:-1024}
      PCI_LLAMA_SERVER_PARALLEL: ${PCI_LLAMA_SERVER_PARALLEL:-4}
      PCI_LLAMA_SERVER_N_GPU_LAYERS: ${PCI_LLAMA_SERVER_N_GPU_LAYERS:-999}
      PCI_LLAMA_SERVER_EXTRA_ARGS: ${PCI_LLAMA_SERVER_EXTRA_ARGS:-}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${PCI_BIND_HOST:-127.0.0.1}:${PCI_EMBEDDING_PORT:-18081}:18081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18081/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10m
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    ipc: host
    security_opt:
      - seccomp=unconfined
    volumes:
      - llamacpp-rocm:/opt/llamacpp-rocm
      - ./models:/models

  llama-cuda:
    profiles: ["nvidia"]
    build:
      context: .
      dockerfile: docker/llamacpp-cuda/Dockerfile
      args:
        CUDA_BASE_IMAGE: ${PCI_CUDA_BASE_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    environment:
      PCI_HF_MODEL_REPO: ${PCI_HF_MODEL_REPO:-Qwen/Qwen3-Embedding-0.6B-GGUF}
      PCI_HF_MODEL_FILE: ${PCI_HF_MODEL_FILE:-Qwen3-Embedding-0.6B-Q8_0.gguf}
      PCI_LLAMA_MODEL: ${PCI_LLAMA_MODEL:-/models/Qwen3-Embedding-0.6B-Q8_0.gguf}
      PCI_EMBEDDING_HOST: 0.0.0.0
      PCI_EMBEDDING_PORT: 18081
      PCI_LLAMA_SERVER_CTX: ${PCI_LLAMA_SERVER_CTX:-40960}
      PCI_LLAMA_SERVER_BATCH: ${PCI_LLAMA_SERVER_BATCH:-2048}
      PCI_LLAMA_SERVER_UBATCH: ${PCI_LLAMA_SERVER_UBATCH:-1024}
      PCI_LLAMA_SERVER_PARALLEL: ${PCI_LLAMA_SERVER_PARALLEL:-4}
      PCI_LLAMA_SERVER_N_GPU_LAYERS: ${PCI_LLAMA_SERVER_N_GPU_LAYERS:-999}
      PCI_LLAMA_SERVER_EXTRA_ARGS: ${PCI_LLAMA_SERVER_EXTRA_ARGS:-}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${PCI_BIND_HOST:-127.0.0.1}:${PCI_EMBEDDING_PORT:-18081}:18081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18081/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    volumes:
      - ./models:/models

volumes:
  pgvector-data:
  fastembed-models:
  lemonade-huggingface:
  lemonade-llama:
  lemonade-cache:
  llamacpp-rocm:
